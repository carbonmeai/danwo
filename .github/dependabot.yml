version: 2

updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Every dependency is pinned to an exact version, so each bump is a reviewed change. They come in
  # batches: one pull request a week for the minor and patch updates, one for the majors, and one
  # for security fixes, instead of one per package.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    ignore:
      # The proxy relies on mockttp's internals (its local port check among them); bump it by hand,
      # with the proxy's slow tests.
      - dependency-name: mockttp
      # danwo runs on Node 22 and 24; its types follow the newer one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # An Expo SDK upgrade moves expo, react-native and react together; done by hand.
      - dependency-name: expo
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-native
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      majors:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      security:
        applies-to: security-updates
        patterns: ["*"]
