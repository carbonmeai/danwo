name: Website

on:
  pull_request:
    paths:
      - "website/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a deploy still going for the same branch.
concurrency:
  group: website-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A pull request from a fork gets no secrets, so it cannot deploy a preview.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run website:build
      # main deploys to danwo.dev; any other branch gets a preview at <branch>.danwo.pages.dev.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          npx --yes wrangler@4.151.3 pages deploy website/dist/client
          --project-name=danwo --branch="$BRANCH" --commit-hash="$GITHUB_SHA" --commit-dirty=true
