name: Security

on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/bun.lock"
      - "**/package-lock.json"
      - .github/vulnerability-allowlist.json
      - .github/workflows/security.yml
      - scripts/audit.ts
      - scripts/vulnerabilities.ts
  push:
    branches: [main]
  # Weekly, so an advisory published against an unchanged lockfile still turns up.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gate: fails on a high or critical advisory in bun.lock that the allowlist does not cover.
  audit:
    name: bun audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # bun audit reads bun.lock alone; nothing is installed.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: node scripts/audit.ts

  # The report: every lockfile in the repository, uploaded to the Security tab.
  osv:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Uploads the SARIF report to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Skips the allowlisted advisories until their review-by dates, as the gate does.
      - run: node scripts/audit.ts --osv-config osv-scanner.toml
      # Exits non-zero on any finding; the audit job is the gate, so this step only reports.
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=sarif
            --output=osv.sarif
            --recursive
            ./
      # A pull request from a fork gets a read-only token, so only this repository's own runs upload.
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: osv.sarif
          category: osv-scanner
