name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its run still going; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: bun run check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The unit tests drive pages in danwo's Chromium.
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - run: bun run check

  # danwo also runs on Node 22; this holds the lowest 22 it supports to the unit tests and to an
  # install of the packed tarballs. `check` above covers formatting, lint and types once, on 24.
  node-22:
    name: Node 22.22.3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: "22.22.3"
          chromium: "true"
      - run: bun run ui:codegen
      - run: bun run test
      - run: bun run release 0.0.0-ci --pack --verify

  # The unit and ui tests on Windows, and an install of the packed tarballs there that runs
  # `danwo test` as a user would. Tests that need a POSIX shell, Linux containers or macOS say so
  # and skip themselves.
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          chromium: "true"
      - run: bun run ui:codegen
      - run: bun run test
      - run: bun run release 0.0.0-ci --pack --verify

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Lists a pull request's commits, to scan only those.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Reads .gitleaks.toml at the root.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Free, but required for a repository owned by an organization: gitleaks.io.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
