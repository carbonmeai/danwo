name: Set up danwo
description: Node (24 unless the caller asks for another), bun at the version package.json pins, and the workspace's dependencies, cached.

inputs:
  node-version:
    description: The Node version to set up.
    default: "24"
  chromium:
    description: Also install Playwright's browsers (Chromium unless `browsers` says) and their system libraries.
    default: "false"
  browsers:
    description: The browsers to install when `chromium` is on, space-separated, e.g. "chromium firefox webkit".
    default: "chromium"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - run: bun install --frozen-lockfile
      shell: bash

    # The browser build follows the pinned playwright-core, so its version keys the cache. Playwright
    # keeps its browsers in ~/.cache on Linux and in %LOCALAPPDATA% on Windows.
    - if: inputs.chromium == 'true'
      id: playwright
      shell: bash
      run: |
        echo "version=$(node -p 'require("playwright-core/package.json").version')" >> "$GITHUB_OUTPUT"
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "browsers=$LOCALAPPDATA\\ms-playwright" >> "$GITHUB_OUTPUT"
        else
          echo "browsers=$HOME/.cache/ms-playwright" >> "$GITHUB_OUTPUT"
        fi
      working-directory: packages/runner

    - if: inputs.chromium == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.playwright.outputs.browsers }}
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.browsers }}

    # Installs the system libraries every time and downloads the browsers only on a cache miss.
    - if: inputs.chromium == 'true'
      shell: bash
      run: npx playwright-core install --with-deps $BROWSERS
      working-directory: packages/runner
      env:
        BROWSERS: ${{ inputs.browsers }}
