<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Fern Studio{% endblock %}</title>
    <link rel="stylesheet" href="/kit/kit.css" />
    <link rel="stylesheet" href="/static/studio.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="shell-sidebar">
        <div class="shell-brand">
          <span class="shell-logo" aria-hidden="true">F</span>
          Fern Studio
        </div>
        <nav class="shell-nav" aria-label="Main">
          <span class="shell-nav-label">Studio</span>
          <a href="/" {% if nav == "timetable" %}aria-current="page"{% endif %}>Timetable</a>
          <a href="/bookings" {% if nav == "bookings" %}aria-current="page"{% endif %}>My bookings</a>
        </nav>
        <p class="shell-sidebar-footer">Tested with danwo</p>
      </aside>
      <div class="shell-main">
        <header class="shell-topbar">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <span>Fern Studio</span>
            <span aria-current="page">{% block crumb %}Timetable{% endblock %}</span>
          </nav>
          <span class="badge badge-info">This week</span>
        </header>
        <main class="shell-content">{% block content %}{% endblock %}</main>
      </div>
    </div>
  </body>
</html>
